name: CI

on:
  push:
    branches: [main, develop, version-cpp-next]
  pull_request:
    branches: [main]

jobs:
  # Release build - primary CI check
  build-release:
    name: Release Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake (Release)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        working-directory: build
        run: ctest --output-on-failure

  # Debug build - catches debug-only issues
  build-debug:
    name: Debug Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake (Debug)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        working-directory: build
        run: ctest --output-on-failure

  # Sanitizer builds - catch memory errors and undefined behavior
  sanitizers:
    name: Sanitizer (${{ matrix.sanitizer }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined]
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake with ${{ matrix.sanitizer }} sanitizer
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=${{ matrix.sanitizer }} -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=${{ matrix.sanitizer }}"

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        working-directory: build
        env:
          # Disable leak detection - test fixtures intentionally don't free all memory
          # ASan still catches use-after-free, buffer overflows, etc.
          ASAN_OPTIONS: detect_leaks=0
        run: ctest --output-on-failure

  # Latency profiling benchmarks - performance regression detection
  latency-profiling:
    name: Latency Profiling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake (Release)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Run latency benchmarks
        working-directory: build
        run: |
          ctest -R benchmark_ --output-on-failure 2>&1 | tee benchmark_output.txt
          echo "## Latency Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat benchmark_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        continue-on-error: true

      - name: Report benchmark metrics
        working-directory: build
        run: |
          echo "## Benchmark Detail" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Benchmark | Status | Time (s) |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|----------|" >> $GITHUB_STEP_SUMMARY
          ctest -R benchmark_ -N 2>/dev/null | grep "Test #" | while read line; do
            test_name=$(echo "$line" | sed 's/.*: //')
            echo "| ${test_name} | - | - |" >> $GITHUB_STEP_SUMMARY
          done
        continue-on-error: true

  # Code formatting check
  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Check formatting (sample)
        run: |
          # Check a sample of files to avoid timeout on large codebase
          # Full format enforcement is opt-in during development
          find src include -name '*.cpp' -o -name '*.hpp' | head -10 | xargs clang-format --dry-run -Werror 2>&1 || echo "::warning::Some files need formatting. Run: clang-format -i src/**/*.cpp include/**/*.hpp"
        continue-on-error: true
